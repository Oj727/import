<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubからスプレッドシートにデータを送信</title>
</head>
<body>
    <h1>スプレッドシートにデータを送信</h1>
    <input type="text" id="inputText" placeholder="入力してください">
    <button onclick="sendData()">送信</button>

    <script>
        function sendData() {
            var inputText = document.getElementById('inputText').value;
            var url = 'https://script.google.com/macros/s/AKfycbwImUh7nzJQIsNP0xdKNY5QJ6RE6_wFY72GJzfuK5mztQgMGc5Y3kX-F_gfMn1mu7cPfQ/exec'; // スクリプトURLをここに貼り付け

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: 'inputText=' + encodeURIComponent(inputText)
            })
            .then(response => response.text())
            .then(data => {
                alert('送信成功: ' + data);
            })
            .catch(error => {
                alert('エラーが発生しました: ' + error);
            });
        }
    </script>
</body>
</html>
